<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranica nije pronađena — Žitopromet Kikinda</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
/* ---------- TESTIMONIAL ---------- */
  .testi-card blockquote{ font-family:'Inter',sans-serif; font-weight:600; font-size:clamp(1.5rem,2.8vw,2.1rem); line-height:1.45; color:var(--ink); }

.article-card{
    display:flex; gap:16px; text-decoration:none; align-items:center; flex:1;
    background:var(--paper); border:1px solid rgba(27,43,28,.08); border-radius:var(--radius-md); padding:12px;
  }

.article-list .article-media{ width:96px; min-width:96px; aspect-ratio:1/1; }

/* ---------- KONTAKT ---------- */
  .contact{
    background:var(--green); color:var(--cream); border-radius:var(--radius-md); padding:clamp(40px,6vw,64px);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:28px;
    position:relative; overflow:hidden;
  }

.contact-bg{ position:absolute; inset:0; z-index:0; }

.hx-row:hover{ flex-grow:6; box-shadow:0 20px 40px -20px rgba(27,43,28,.2); border-color:rgba(49,103,53,.22); }

.hx-row:hover .hx-content{ padding-top:16px; padding-bottom:16px; }

.hx-row:hover .hx-icon{ background:var(--green); transform:scale(1.06) rotate(-4deg); }

.hx-row:hover .hx-icon svg path, .hx-row:hover .hx-icon svg circle, .hx-row:hover .hx-icon svg ellipse{ stroke:var(--gold); }

.hx-label{ font-family:'Inter',sans-serif; font-size:1.15rem; font-weight:700; line-height:1.3; color:var(--ink); }

.hx-row:hover .hx-desc{ max-height:110px; opacity:1; margin-top:6px; }

.testi-quotemark{
    font-family:'Inter',sans-serif; font-weight:700; font-size:3rem; line-height:1;
    color:var(--green); margin-bottom:2px; display:block;
  }

.contact-info-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:0;
    margin-top:clamp(32px,4vw,44px); margin-left:calc(-1 * clamp(40px,6vw,64px)); margin-right:calc(-1 * clamp(40px,6vw,64px));
    padding-top:clamp(28px,3.5vw,36px); padding-left:clamp(40px,6vw,64px); padding-right:clamp(40px,6vw,64px);
    border-top:1px solid rgba(247,242,226,.18);
  }

.page-top{ padding-top:clamp(150px,17vw,200px) !important; }

.blog-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px; margin-top:40px; position:relative; z-index:1; }

.blog-card{
    background:var(--paper); border:1px solid rgba(27,43,28,.08); border-radius:var(--radius-md); overflow:hidden;
    text-decoration:none; color:inherit; display:flex; flex-direction:column;
    transition:transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s ease, border-color .35s ease;
  }

.blog-card:hover{ transform:translateY(-4px); box-shadow:0 24px 44px -24px rgba(27,43,28,.28); border-color:rgba(49,103,53,.22); }

.blog-card .article-media{ border-radius:0; aspect-ratio:16/11; position:relative; }

.blog-card-body{ padding:clamp(16px,2.2vw,22px); display:flex; flex-direction:column; gap:8px; flex:1; }

.blog-card-body h3{ font-size:1.2rem; font-weight:700; line-height:1.3; }

.blog-card-body .article-meta{ margin-top:0; }

.blog-card-body .btn-text{ margin-top:auto; }

.error-page{
    min-height:64vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding-top:clamp(150px,17vw,200px); padding-bottom:80px; position:relative; z-index:1;
  }

.error-code{ font-family:'Inter',sans-serif; font-weight:700; font-size:clamp(5.5rem,15vw,9.5rem); color:var(--green); line-height:1; letter-spacing:-.02em; }

.error-page h1{ margin-top:8px; font-size:clamp(1.7rem,3.4vw,2.4rem); }

.error-page p{ margin-top:14px; max-width:46ch; color:var(--ink-muted); font-size:1.02rem; line-height:1.6; }

.error-page .btn{ margin-top:32px; }

.kontakt-hero-info{ margin-top:clamp(40px,5vw,56px); }

@media (max-width:720px){
    .blog-grid{ grid-template-columns:1fr; }
  }
</style>

</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="wheatMotif" viewBox="0 0 200 520">
    <path d="M100 500 C96 400,104 300,100 60"/>
    <path d="M100 60 C90 70,84 82,86 96"/>
    <path d="M100 60 C110 70,116 82,114 96"/>
    <path d="M100 95 C90 105,84 117,86 131"/>
    <path d="M100 95 C110 105,116 117,114 131"/>
    <path d="M100 130 C90 140,84 152,86 166"/>
    <path d="M100 130 C110 140,116 152,114 166"/>
    <path d="M100 165 C90 175,84 187,86 201"/>
    <path d="M100 165 C110 175,116 187,114 201"/>
  </symbol>
</svg>

<nav id="siteNav">
  <div class="nav-pill">
    <div class="brand"><img width="160" height="111" src="images/logo.webp" alt="Žitopromet logo"></div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html" data-i18n="nav.home">Početna</a></li>
      <li><a href="index.html#sta-radimo" data-i18n="nav.what">Šta radimo</a></li>
      <li><a href="index.html#o-nama" data-i18n="nav.about">O nama</a></li>
      <li><a href="index.html#kulture" data-i18n="nav.cultures">Kulture</a></li>
      <li><a href="index.html#clanci" data-i18n="nav.articles">Blog</a></li>
      <li><a href="index.html#kontakt" data-i18n="nav.contact">Kontakt</a></li>
    </ul>
    <div class="lang-switch">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
      <div class="lang-opts">
        <button type="button" class="lang-btn active" data-lang="sr">SR</button>

    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Meni" data-i18n-attr="aria-label:aria.menu">
      <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</nav>

<main>

<section class="section" style="padding-top:0; padding-bottom:0;">
  <svg viewBox="0 0 200 520" class="motif" data-base-style="width:280px; top:10%; left:-60px; transform:rotate(-8deg);" style="width:280px; top:10%; left:-60px; transform:rotate(-8deg);"><use href="#wheatMotif"/></svg>
  <div class="wrap">
    <div class="error-page reveal">
      <div class="error-code">404</div>
      <h1 data-i18n="e404.title">Stranica nije pronađena</h1>
      <p data-i18n="e404.text">Izgleda da je stranica koju tražite premeštena, obrisana ili nikad nije ni postojala. Proverite adresu ili se vratite na početnu.</p>
      <a href="index.html" class="btn"><span data-i18n="e404.back">Nazad na početnu</span></a>
    </div>
  </div>
</section>

</main>

<footer data-i18n="footer.copy">© Zemljoradnička zadruga Žitopromet, Kikinda</footer>

<script src="script.js"></script>

<div id="backToTopWrap" class="back-to-top-wrap">
  <button id="backToTopBtn" type="button" aria-label="Nazad na vrh" data-i18n-attr="aria-label:aria.top" class="back-to-top-btn">
